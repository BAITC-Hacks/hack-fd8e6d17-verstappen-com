services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - backend-data:/app/data

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      API_URL: http://backend:8000
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  backend-data:
