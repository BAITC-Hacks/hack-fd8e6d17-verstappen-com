# Переменные берутся из .env в корне (см. .env.example).
#   docker compose up -d db       — только PostgreSQL (так делает run.sh)
#   docker compose up --build     — всё приложение в контейнерах
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hacksana}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1: при первом запуске образ поднимает временный сервер только на unix-сокете
      # и потом перезапускается — по TCP проверка пройдёт лишь когда поднят настоящий сервер
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./.env
        required: false
    environment:
      # внутри сети compose база доступна по имени сервиса, а не localhost
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-hacksana}
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      API_URL: http://backend:8000
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pg-data:
